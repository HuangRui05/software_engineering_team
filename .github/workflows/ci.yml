name: Python CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 直接指定 Python 版本，不使用花哨的动作
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      # 关键：强制进入 my-mud-game 目录执行测试
      - name: Run unit tests
        run: |
          cd my-mud-game
          python -m pytest test_mud.py -v
